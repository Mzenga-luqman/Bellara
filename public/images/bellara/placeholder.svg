<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Bellara Photo Placeholder</title>
  <desc id="desc">Temporary placeholder shown until Bellara photos are uploaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8f2e7"/>
      <stop offset="100%" stop-color="#ead6b5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d8b784"/>
      <stop offset="100%" stop-color="#b7925f"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="8" opacity="0.85">
    <path d="M0 520 C180 440, 320 600, 520 520 S860 440, 1060 520 S1240 600, 1400 520"/>
    <path d="M0 580 C180 500, 320 660, 520 580 S860 500, 1060 580 S1240 660, 1400 580"/>
  </g>
  <g fill="#7f6135" text-anchor="middle">
    <text x="700" y="390" font-size="74" font-family="Georgia, serif" font-weight="600">Bellara</text>
    <text x="700" y="455" font-size="30" font-family="Arial, sans-serif" letter-spacing="4">BEAUTY &amp; SPA LOUNGE</text>
    <text x="700" y="540" font-size="24" font-family="Arial, sans-serif" opacity="0.8">Upload your brand photos to public/images/bellara</text>
  </g>
</svg>
